<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KALY</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🪡 KALY Admin</h1>
            <p>Connexion administrateur</p>
            
            <form id="login-form">
                <div class="form-group">
                    <input type="password" id="password" placeholder="Mot de passe admin" required>
                </div>
                <button type="submit" class="btn btn-primary">Se Connecter</button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        // IMPORTANT: Remplacez par votre URL backend
        const API_URL = 'https://kaly-backend.onrender.com/api';
        
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            
            try {
                // Test connection avec le mot de passe
                const response = await fetch(`${API_URL}/products`, {
                    headers: {
                        'password': password
                    }
                });
                
                if (response.ok) {
                    localStorage.setItem('kaly_admin_password', password);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = '❌ Mot de passe incorrect';
                }
            } catch (error) {
                errorMsg.textContent = '❌ Erreur de connexion au serveur';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
