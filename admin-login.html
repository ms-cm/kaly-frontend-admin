<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — KALY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--rose:#e8a0b0;--rose-deep:#c9687e;--gold:#c9a84c;--dark:#1a1218;--mid:#2e2129;--white:#fff}
    html,body{height:100%}
    body{font-family:'DM Sans',sans-serif;background:var(--dark);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden}
    body::before{content:'';position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(201,104,126,.15) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none}
    body::after{content:'';position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);bottom:-200px;left:-200px;pointer-events:none}
    .card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 36px;backdrop-filter:blur(16px);position:relative;z-index:1;animation:cardIn .5s ease}
    @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:32px}
    .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--rose-deep),var(--gold));display:flex;align-items:center;justify-content:center;font-size:20px}
    .logo-text{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--white)}
    .logo-text span{color:var(--gold)}
    .admin-badge{display:inline-block;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 12px;border-radius:99px;margin-left:8px}
    h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:var(--white);margin-bottom:6px}
    .sub{color:rgba(255,255,255,.4);font-size:.88rem;margin-bottom:28px}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:7px;letter-spacing:.03em}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.25);font-size:.9rem;pointer-events:none}
    .input-wrap input{width:100%;padding:13px 14px 13px 40px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--white);font-size:.93rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
    .input-wrap input::placeholder{color:rgba(255,255,255,.25)}
    .input-wrap input:focus{border-color:var(--rose);background:rgba(255,255,255,.1)}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.9rem;padding:4px;transition:color .2s}
    .eye-btn:hover{color:var(--rose)}
    .error-msg{display:none;align-items:center;gap:8px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:11px 14px;color:#fca5a5;font-size:.84rem;margin-bottom:16px}
    .error-msg.show{display:flex}
    .btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--rose-deep),var(--gold));color:var(--white);border:none;border-radius:12px;font-size:.95rem;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-submit:hover:not(:disabled){opacity:.88}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
    .btn-submit.loading .spinner{display:block}
    .btn-submit.loading .lbl{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .back-link{display:flex;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.3);font-size:.82rem;text-decoration:none;margin-top:20px;transition:color .2s}
    .back-link:hover{color:var(--rose)}
  </style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon">&#x1FAA1;</div>
    <span class="logo-text">KALY<span>.</span></span>
    <span class="admin-badge">Admin</span>
  </div>
  <h1>Espace Admin</h1>
  <p class="sub">Connectez-vous avec votre mot de passe administrateur</p>
  <div class="error-msg" id="err"><i class="fas fa-exclamation-circle"></i><span id="err-text"></span></div>
  <div class="field">
    <label>Mot de passe administrateur</label>
    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
      <button class="eye-btn" type="button" id="eye-btn"><i class="fas fa-eye" id="eye-icon"></i></button>
    </div>
  </div>
  <button class="btn-submit" id="submit-btn">
    <div class="spinner"></div>
    <span class="lbl"><i class="fas fa-sign-in-alt"></i> Se connecter</span>
  </button>
  <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour au site</a>
</div>
<script>
var API = 'https://kaly-backend.onrender.com/api';
document.getElementById('eye-btn').addEventListener('click', function(){
  var inp = document.getElementById('pwd'); var icon = document.getElementById('eye-icon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
});
document.getElementById('submit-btn').addEventListener('click', async function(){
  var btn = this; var pwd = document.getElementById('pwd').value.trim();
  var err = document.getElementById('err'); var errTxt = document.getElementById('err-text');
  err.classList.remove('show');
  if (!pwd) { errTxt.textContent = 'Entrez le mot de passe'; err.classList.add('show'); return; }
  btn.disabled = true; btn.classList.add('loading');
  try {
    var res = await fetch(API + '/admin/stats', { headers: { 'password': pwd } });
    if (res.ok) {
      localStorage.setItem('kaly_admin_password', pwd);
      window.location.href = 'dashboard.html';
    } else {
      errTxt.textContent = 'Mot de passe incorrect';
      err.classList.add('show');
    }
  } catch(e) {
    errTxt.textContent = 'Serveur inaccessible. Verifiez votre connexion.';
    err.classList.add('show');
  } finally { btn.disabled = false; btn.classList.remove('loading'); }
});
document.getElementById('pwd').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('submit-btn').click(); });
if (localStorage.getItem('kaly_admin_password')) window.location.href = 'dashboard.html';
</script>
</body>
</html>
