<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — KALY Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rose:#e8a0b0;--rose-deep:#c9687e;--gold:#c9a84c;
  --dark:#1a1218;--mid:#2e2129;--sidebar-bg:#120e15;
  --soft:#f7f1f3;--muted:#8a717a;--white:#fff;--green:#25D366;
  --radius:12px;--sw:240px;--topbar:56px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--soft);color:var(--dark);min-height:100vh}

/* ── TOPBAR (always visible) ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:var(--topbar);
  background:var(--sidebar-bg);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.ham-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.ham-btn span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:all .25s}
.logo-row{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--rose-deep),var(--gold));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.logo-text{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:#fff}
.logo-text span{color:var(--gold)}
.admin-pill{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.25);color:var(--gold);font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.topbar-right{display:flex;align-items:center;gap:10px}
.page-label{color:rgba(255,255,255,.6);font-size:.85rem;font-weight:500}
.logout-top{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.2);color:#f87171;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ── SIDEBAR ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
.sidebar-overlay.show{display:block}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:250;
  width:var(--sw);
  background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  transform:translateX(-100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.sidebar.open{transform:translateX(0)}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;
}
.close-sidebar{background:none;border:none;color:rgba(255,255,255,.4);font-size:1.1rem;cursor:pointer;padding:4px}
.close-sidebar:hover{color:#fff}
.sidebar-nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:10px 12px 4px;margin-top:6px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 13px;border-radius:10px;
  color:rgba(255,255,255,.55);font-size:.87rem;font-weight:500;
  text-decoration:none;cursor:pointer;border:none;background:none;width:100%;
  transition:all .15s;font-family:'DM Sans',sans-serif;text-align:left;
}
.nav-item i{width:17px;text-align:center;font-size:.88rem;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(232,160,176,.12);color:var(--rose);border:1px solid rgba(232,160,176,.18)}
.nav-item.active i{color:var(--rose)}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.nav-logout{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:#f87171;font-size:.87rem;font-weight:500;cursor:pointer;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;transition:background .15s}
.nav-logout:hover{background:rgba(248,113,113,.1)}

/* ── MAIN CONTENT ── */
.main{margin-top:var(--topbar);min-height:calc(100vh - var(--topbar));padding:20px 16px 40px}

/* ── SECTION ── */
.section{display:none}
.section.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.section-head h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px;border:1px solid rgba(0,0,0,.06);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-16px;right:-16px;width:60px;height:60px;border-radius:50%;opacity:.08}
.stat-card.rose::after{background:var(--rose-deep)}.stat-card.gold::after{background:var(--gold)}
.stat-card.green::after{background:#10b981}.stat-card.blue::after{background:#3b82f6}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.9rem;margin-bottom:10px}
.stat-card.rose .stat-icon{background:rgba(201,104,126,.1);color:var(--rose-deep)}
.stat-card.gold .stat-icon{background:rgba(201,168,76,.1);color:var(--gold)}
.stat-card.green .stat-icon{background:rgba(16,185,129,.1);color:#10b981}
.stat-card.blue .stat-icon{background:rgba(59,130,246,.1);color:#3b82f6}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:var(--dark);line-height:1}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:3px}

/* ── CARD ── */
.card{background:var(--white);border-radius:var(--radius);border:1px solid rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-size:.9rem;font-weight:700}

/* ── TABLE (scrollable on mobile) ── */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:480px}
thead th{padding:10px 14px;text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid rgba(0,0,0,.06);white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(0,0,0,.02)}
td{padding:11px 14px;font-size:.86rem;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.empty-td{text-align:center;padding:32px;color:var(--muted);font-size:.88rem}
.prod-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--soft);flex-shrink:0}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700}
.b-rose{background:rgba(201,104,126,.1);color:var(--rose-deep)}
.b-gold{background:rgba(201,168,76,.1);color:#9a7500}
.b-green{background:rgba(16,185,129,.1);color:#059669}
.b-red{background:rgba(239,68,68,.09);color:#dc2626}
.b-gray{background:rgba(0,0,0,.06);color:var(--muted)}

/* ── SEARCH BAR ── */
.search-bar{position:relative}
.search-bar i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.82rem;pointer-events:none}
.search-bar input{padding:9px 12px 9px 32px;border:1.5px solid rgba(0,0,0,.1);border-radius:9px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;width:100%}
.search-bar input:focus{border-color:var(--rose-deep)}

/* ── ACTION BUTTONS ── */
.action-row{display:flex;gap:6px}
.abtn{width:30px;height:30px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.78rem;transition:all .15s}
.abtn-edit{background:rgba(201,168,76,.1);color:#9a7500}.abtn-edit:hover{background:rgba(201,168,76,.25)}
.abtn-del{background:rgba(239,68,68,.09);color:#dc2626}.abtn-del:hover{background:rgba(239,68,68,.2)}
.abtn-tog{background:rgba(16,185,129,.1);color:#059669}.abtn-tog:hover{background:rgba(16,185,129,.2)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--rose-deep),var(--gold));color:#fff}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-soft{background:rgba(0,0,0,.06);color:var(--dark)}.btn-soft:hover{background:rgba(0,0,0,.1)}
.btn-danger{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:7px 14px;font-size:.8rem}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .sp{display:block}.btn.loading .lbl{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:.8rem;font-weight:600;color:var(--dark)}
.fg input,.fg select,.fg textarea{padding:10px 13px;border:1.5px solid rgba(0,0,0,.1);border-radius:9px;font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none;color:var(--dark);background:#fff;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--rose-deep)}
.fg textarea{resize:vertical;min-height:80px}
.check-row{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.88rem;font-weight:500}
.check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--rose-deep);cursor:pointer}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed rgba(0,0,0,.14);border-radius:11px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:#fff}
.upload-zone:hover,.upload-zone.drag{border-color:var(--rose-deep);background:rgba(232,160,176,.04)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone i{font-size:1.8rem;color:var(--muted);margin-bottom:8px;display:block}
.upload-zone p{font-size:.84rem;color:var(--muted)}.upload-zone strong{color:var(--rose-deep)}
.prog-bar{height:4px;border-radius:99px;background:rgba(0,0,0,.07);margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--rose-deep),var(--gold));border-radius:99px;width:0%;transition:width .3s}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:12px}
.prev-item{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--soft)}
.prev-item img{width:100%;height:100%;object-fit:cover}
.prev-rm{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(220,38,38,.85);border:none;border-radius:50%;color:#fff;font-size:.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── TAGS ── */
.tags-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:7px;border:1.5px solid rgba(0,0,0,.1);border-radius:9px;cursor:text;min-height:40px;align-items:center;background:#fff;transition:border-color .2s}
.tags-wrap:focus-within{border-color:var(--rose-deep)}
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(201,104,126,.1);color:var(--rose-deep);padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600}
.tag button{background:none;border:none;cursor:pointer;color:var(--rose-deep);font-size:.65rem;line-height:1;padding:0}
.tag-input{border:none;outline:none;font-size:.85rem;font-family:'DM Sans',sans-serif;min-width:60px;flex:1;background:transparent}

/* ── PROMO FORM ── */
.promo-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.modal-btns{display:flex;gap:10px}
.modal-btns .btn{flex:1;justify-content:center}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:12px 20px;border-radius:12px;color:#fff;font-size:.86rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;white-space:nowrap;animation:toastIn .3s ease}
.toast.success{background:#10b981}.toast.error{background:#ef4444}.toast.info{background:#3b82f6}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── MISC ── */
.low-stock{color:#dc2626;font-weight:700}
.divider{height:1px;background:rgba(0,0,0,.07);margin:16px 0}
code{font-family:monospace;background:rgba(0,0,0,.06);padding:2px 7px;border-radius:5px;font-size:.88rem;font-weight:700}

/* ── RESPONSIVE ── */
@media(min-width:900px){
  .ham-btn{display:none}
  .sidebar{transform:translateX(0)}
  .sidebar-head .close-sidebar{display:none}
  .main{margin-left:var(--sw)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .form-grid{grid-template-columns:1fr 1fr}
  .promo-form-grid{grid-template-columns:1fr 1fr 1fr auto}
  .modal-bg{align-items:center;padding:20px}
  .modal{border-radius:16px}
  @keyframes slideUp{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .promo-form-grid{grid-template-columns:1fr 1fr}
  .btn{padding:9px 14px;font-size:.82rem}
  .main{padding:16px 12px 40px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <button class="ham-btn" id="ham-btn"><span></span><span></span><span></span></button>
    <a href="../index.html" class="logo-row">
      <div class="logo-icon">&#x1FAA1;</div>
      <span class="logo-text">KALY<span>.</span></span>
    </a>
    <span class="admin-pill">Admin</span>
  </div>
  <div class="topbar-right">
    <span class="page-label" id="page-label">Dashboard</span>
    <button class="logout-top" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span class="d-label">Quitter</span></button>
  </div>
</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sb-overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo-icon">&#x1FAA1;</div>
      <div>
        <div class="logo-text" style="font-size:1.1rem">KALY<span>.</span></div>
        <span class="admin-pill" style="font-size:.58rem">Admin</span>
      </div>
    </div>
    <button class="close-sidebar" id="close-sb"><i class="fas fa-times"></i></button>
  </div>
  <nav class="sidebar-nav">
    <span class="nav-label">Tableau de bord</span>
    <button class="nav-item active" id="nav-dashboard" onclick="goTo('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <span class="nav-label">Catalogue</span>
    <button class="nav-item" id="nav-products" onclick="goTo('products')"><i class="fas fa-box"></i> Produits</button>
    <button class="nav-item" id="nav-add" onclick="goTo('add')"><i class="fas fa-plus-circle"></i> Ajouter un produit</button>
    <span class="nav-label">Marketing</span>
    <button class="nav-item" id="nav-promos" onclick="goTo('promos')"><i class="fas fa-tag"></i> Codes Promo</button>
    <span class="nav-label">Clients</span>
    <button class="nav-item" id="nav-users" onclick="goTo('users')"><i class="fas fa-users"></i> Clients</button>
    <span class="nav-label">Site</span>
    <a class="nav-item" href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Voir le Site</a>
  </nav>
  <div class="sidebar-foot">
    <button class="nav-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Deconnexion</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- ── DASHBOARD ── -->
  <div class="section active" id="sec-dashboard">
    <div class="section-head"><h2>Tableau de bord</h2><button class="btn btn-soft btn-sm" onclick="loadStats()"><i class="fas fa-sync-alt"></i> Actualiser</button></div>
    <div class="stats-grid">
      <div class="stat-card rose"><div class="stat-icon"><i class="fas fa-box"></i></div><div class="stat-num" id="s-prods">—</div><div class="stat-label">Produits</div></div>
      <div class="stat-card gold"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-num" id="s-users">—</div><div class="stat-label">Clients</div></div>
      <div class="stat-card green"><div class="stat-icon"><i class="fas fa-tag"></i></div><div class="stat-num" id="s-promos">—</div><div class="stat-label">Promos actives</div></div>
      <div class="stat-card blue"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-num" id="s-feat">—</div><div class="stat-label">Vedettes</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:14px">
      <div class="card">
        <div class="card-head"><span class="card-title">Stock faible <span class="badge b-red" id="s-low">—</span></span></div>
        <div class="table-scroll"><table><thead><tr><th>Produit</th><th>Categorie</th><th>Stock</th></tr></thead><tbody id="tb-low"><tr><td class="empty-td" colspan="3">Chargement...</td></tr></tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Par categorie</span></div>
        <div class="table-scroll"><table><thead><tr><th>Categorie</th><th>Nb produits</th></tr></thead><tbody id="tb-cats"><tr><td class="empty-td" colspan="2">Chargement...</td></tr></tbody></table></div>
      </div>
    </div>
  </div>

  <!-- ── PRODUCTS ── -->
  <div class="section" id="sec-products">
    <div class="section-head">
      <h2>Produits</h2>
      <button class="btn btn-primary btn-sm" onclick="goTo('add')"><i class="fas fa-plus"></i> <span class="lbl">Ajouter</span></button>
    </div>
    <div class="card">
      <div class="card-head" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="prod-search" placeholder="Rechercher un produit..." oninput="filterProds()"></div>
        <select id="cat-filter" onchange="filterProds()" style="padding:9px 12px;border:1.5px solid rgba(0,0,0,.1);border-radius:9px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;background:#fff">
          <option value="">Toutes les categories</option>
          <option value="vetements">Vetements</option>
          <option value="sacs">Sacs</option>
          <option value="chaussures">Chaussures</option>
          <option value="accessoires">Accessoires</option>
        </select>
      </div>
      <div class="table-scroll">
        <table>
